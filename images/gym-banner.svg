<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <!-- Gym floor -->
  <rect width="480" height="360" fill="#1e293b"/>
  <rect y="280" width="480" height="80" fill="#0f172a"/>
  <rect y="276" width="480" height="4" fill="#38bdf8" opacity="0.4"/>

  <!-- Floor rubber mats -->
  <rect x="40" y="292" width="120" height="8" rx="4" fill="#334155"/>
  <rect x="200" y="292" width="120" height="8" rx="4" fill="#334155"/>
  <rect x="350" y="292" width="90" height="8" rx="4" fill="#334155"/>

  <!-- Plate tree silhouette -->
  <rect x="432" y="150" width="8" height="130" fill="#334155"/>
  <circle cx="436" cy="180" r="26" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.5"/>
  <circle cx="436" cy="238" r="32" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.35"/>

  <!-- Dumbbell silhouette -->
  <rect x="60" y="196" width="70" height="10" rx="5" fill="#94a3b8"/>
  <rect x="52" y="182" width="14" height="38" rx="4" fill="#94a3b8"/>
  <rect x="124" y="182" width="14" height="38" rx="4" fill="#94a3b8"/>
  <rect x="46" y="188" width="8" height="26" rx="3" fill="#38bdf8" opacity="0.7"/>
  <rect x="136" y="188" width="8" height="26" rx="3" fill="#38bdf8" opacity="0.7"/>

  <!-- Big barbell -->
  <rect x="140" y="216" width="230" height="12" rx="6" fill="#e2e8f0"/>
  <!-- Left plates -->
  <rect x="150" y="176" width="16" height="92" rx="6" fill="#38bdf8"/>
  <rect x="168" y="188" width="12" height="68" rx="5" fill="#7dd3fc"/>
  <rect x="182" y="200" width="10" height="44" rx="4" fill="#94a3b8"/>
  <!-- Right plates -->
  <rect x="330" y="176" width="16" height="92" rx="6" fill="#38bdf8"/>
  <rect x="312" y="188" width="12" height="68" rx="5" fill="#7dd3fc"/>
  <rect x="300" y="200" width="10" height="44" rx="4" fill="#94a3b8"/>

  <!-- Glow accents -->
  <circle cx="176" cy="222" r="46" fill="#38bdf8" opacity="0.08"/>
  <circle cx="334" cy="222" r="46" fill="#38bdf8" opacity="0.08"/>

  <!-- Shaker bottle -->
  <rect x="228" y="130" width="26" height="42" rx="6" fill="#334155"/>
  <rect x="232" y="122" width="18" height="10" rx="3" fill="#38bdf8"/>
  <rect x="234" y="140" width="14" height="18" rx="3" fill="#38bdf8" opacity="0.6"/>
</svg>
